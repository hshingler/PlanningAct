<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>Planning Act 2026</title><style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#1c2733;--muted:#667482;--line:#dfe5eb;--accent:#126d80;--soft:#e8f4f5;--warn:#fff4d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--paper);border-bottom:1px solid var(--line);padding:18px max(18px,calc((100vw - 1440px)/2));position:sticky;top:0;z-index:5}header h1{font-size:1.25rem;margin:0}header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}.layout{max-width:1440px;margin:auto;padding:18px;display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px}.sidebar,.reader{background:var(--paper);border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden}.sidebar{align-self:start;position:sticky;top:100px}.searchbox{padding:14px;border-bottom:1px solid var(--line)}input,select,button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:white;color:var(--ink);max-width:100%}input{width:100%}button{cursor:pointer}button:hover,.link:hover{color:var(--accent);border-color:var(--accent)}.nav{padding:8px;max-height:65vh;overflow:auto}.navitem{display:block;width:100%;text-align:left;border:0;border-radius:7px;padding:8px 9px;background:transparent;overflow-wrap:anywhere}.navitem.active{background:var(--soft);color:var(--accent);font-weight:650}.navitem small{display:block;color:var(--muted);font-size:.78rem;font-weight:400}.reader-head{padding:22px 26px 16px;border-bottom:1px solid var(--line)}.reader-head h2{font-size:1.55rem;line-height:1.25;margin:0 0 8px}.crumb{color:var(--muted);font-size:.82rem}.reader-body{padding:18px 26px 30px}.block{padding:5px 0 5px 15px;margin:4px 0;border-left:2px solid #e6ebef;overflow-wrap:anywhere}.blocktext{white-space:pre-wrap}.block.empty{color:var(--muted);font-style:italic}.block-tools{display:inline-flex;gap:5px;margin-left:7px;opacity:.65}.mini{font-size:.76rem;padding:1px 6px;border-radius:5px;background:#f3f6f8}.link{color:var(--accent);text-decoration:underline;text-decoration-color:#b9d9df;text-underline-offset:2px;cursor:pointer;border:0;padding:0;background:transparent}.section{border-top:1px solid var(--line);margin-top:24px;padding-top:16px}.section h3{font-size:1rem;margin:0 0 10px}.ref{padding:7px 0;border-bottom:1px solid #edf0f3}.ref small{display:block;color:var(--muted)}.tag{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 8px;font-size:.77rem;margin:2px}.status{padding:12px 14px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line)}.results{max-height:65vh;overflow:auto}.searchresult{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf0f3;border-radius:0;background:transparent;padding:11px 14px}.searchresult strong{display:block}.searchresult small{color:var(--muted)}.empty{padding:24px;color:var(--muted)}.topline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.pill{font-size:.78rem;border:1px solid var(--line);padding:3px 8px;border-radius:999px;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr;padding:10px}.sidebar{position:static}.nav,.results{max-height:32vh}.reader-head,.reader-body{padding:17px}.reader-head h2{font-size:1.3rem}}
</style></head><body><header><h1>Planning Act 2026</h1><p>A searchable, linked legislative reference</p></header><div class="layout"><aside class="sidebar"><div class="searchbox"><input id="q" type="search" placeholder="Search provisions, terms, definitions…" aria-label="Search the Act"><div class="topline"><button id="home">Home</button><span id="count" class="pill">Loading Act…</span></div></div><div id="nav" class="nav"><div class="empty">Loading pages…</div></div><div id="status" class="status">Preparing the Act…</div></aside><main class="reader"><div id="reader"><div class="empty">Loading the Planning Act…</div></div></main></div><script>
const $=id=>document.getElementById(id);let db,pages=[],records=[],byId=new Map(),pageByName=new Map(),children=new Map(),incoming=new Map(),current=null,searchTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function init(d){db=d;pages=d.pages;records=d.records;byId=new Map(records.map(x=>[x.id,x]));for(const p of pages){pageByName.set((p.name||p.label).toLocaleLowerCase(),p);pageByName.set(p.label.toLocaleLowerCase(),p)}for(const b of records){if(b.parentId!=null){if(!children.has(b.parentId))children.set(b.parentId,[]);children.get(b.parentId).push(b.id)}for(const r of b.refs){if(!incoming.has(r))incoming.set(r,[]);incoming.get(r).push(b.id)}}for(const arr of children.values())arr.sort((a,b)=>String(byId.get(a)?.order||'').localeCompare(String(byId.get(b)?.order||''),undefined,{numeric:true}));pages.sort((a,b)=>a.label.localeCompare(b.label));$('count').textContent=`${pages.length} pages`;renderNav();$('status').textContent='Ready';$('q').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(search,120)});$('home').onclick=()=>openHome();const hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith('page=')){const p=pages.find(p=>String(p.id)===hash.slice(5))||pageByName.get(hash.slice(5).toLowerCase());if(p)openPage(p.id)}else openHome()}
function isActPage(p){const names=(p.tags||[]).map(t=>byId.get(t)?.text||'').map(x=>x.toLowerCase());return names.includes('pa2026')||['planning act 2026 — home','parts and subparts'].includes(p.label.toLowerCase())}function renderNav(filter=''){const nav=$('nav');nav.innerHTML='';const q=filter.toLowerCase();const chosen=pages.filter(p=>isActPage(p)).filter(p=>{const r=records.filter(b=>b.id===p.id||b.pageId===p.id);return !q||p.label.toLowerCase().includes(q)||r.some(b=>b.text.toLowerCase().includes(q))}).slice(0,500);for(const p of chosen){const b=document.createElement('button');b.className='navitem'+(current?.id===p.id?' active':'');b.innerHTML=`${esc(p.label)}<small>${esc((p.tags||[]).map(t=>byId.get(t)?.text||'').filter(Boolean).slice(0,2).join(' · '))}</small>`;b.onclick=()=>openPage(p.id);nav.append(b)}if(!chosen.length)nav.innerHTML='<div class="empty">No matching pages.</div>';if(chosen.length===500){const n=document.createElement('div');n.className='status';n.textContent='Showing first 500 pages; use search to narrow the list.';nav.append(n)}}
function openHome(){const p=pages.find(p=>p.label==='Planning Act 2026 — Home')||pages.find(p=>/home/i.test(p.label)&&/planning act/i.test(p.label))||pages.find(p=>/planning act 2026/i.test(p.label));if(p)openPage(p.id);else{$('reader').innerHTML='<div class="reader-head"><h2>Planning Act 2026</h2></div><div class="reader-body">Choose a page from the list or search the Act.</div>'}}
function openPage(id){const p=pages.find(x=>x.id===id);if(!p)return;current=p;history.replaceState(null,'','#page='+id);renderNav($('q').value);const root=records.filter(b=>b.id===id||b.pageId===id).filter(b=>b.id===id||b.parentId===id);const content=root.filter(b=>b.id!==id);$('reader').innerHTML=`<div class="reader-head"><div class="crumb">Planning Act 2026 / Reference</div><h2>${esc(p.label)}</h2><div class="topline">${(p.tags||[]).map(t=>`<span class="tag">${esc(byId.get(t)?.text||'Tag')}</span>`).join('')}<span class="pill">${content.length} top-level blocks</span></div></div><div class="reader-body">${content.map(b=>renderBlock(b,0,new Set())).join('')||'<p class="empty">No content blocks found for this page in the export.</p>'}${renderReferences(p.id)}</div>`;wireLinks($('reader'))}
function renderBlock(b,depth,seen){if(!b||depth>30||seen.has(b.id))return '';seen=new Set(seen);seen.add(b.id);const kids=(children.get(b.id)||[]).map(id=>byId.get(id)).filter(Boolean);const body=renderText(b.text);const refs=b.resolvedRefs||[];return `<div class="block ${b.text?'':'empty'}" data-id="${b.id}"><div class="blocktext">${body||'(empty block)'} <span class="block-tools"><button class="mini" data-refblock="${b.id}" title="Show block references">↗ refs</button></span></div>${kids.map(k=>renderBlock(k,depth+1,seen)).join('')}</div>`}
function renderText(text){let out=esc(text);out=out.replace(/\[\[([^\]]+)\]\]/g,(all,label)=>{const p=pageByName.get(label.trim().toLowerCase());return p?`<button class="link" data-page="${p.id}">${esc(p.label)}</button>`:esc(label)});out=out.replace(/\(\(([0-9a-f-]{36})\)\)/gi,(all,uuid)=>{const b=records.find(x=>x.uuid===uuid);return b?`<button class="link" data-block-open="${b.id}">${esc(b.text||'block')}</button>`:all});out=out.replace(/https?:\/\/[^\s)]+/g,u=>`<a class="link" href="${u}" target="_blank" rel="noopener">${u}</a>`);return out}
function renderReferences(id){const all=records.filter(b=>b.id!==id&&b.pageId===id);const refs=records.filter(b=>b.id===id).flatMap(b=>b.resolvedRefs||[]);const inc=(incoming.get(id)||[]).map(x=>byId.get(x)).filter(Boolean);const uniq=new Map();for(const b of inc)uniq.set(b.id,b);return `<div class="section"><h3>Linked references (${uniq.size})</h3>${[...uniq.values()].slice(0,100).map(b=>`<div class="ref">${b.kind==='page'?`<button class="link" data-page="${b.id}">${esc(b.text)}</button>`:`<button class="link" data-page="${b.pageId}">${esc(b.text)}</button>`}<small>${esc(b.page)}</small></div>`).join('')||'<div class="muted">No incoming references recorded for this page.</div>'}</div>`}
function wireLinks(root){root.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>openPage(Number(x.dataset.page)));root.querySelectorAll('[data-block-open]').forEach(x=>x.onclick=()=>{const b=byId.get(Number(x.dataset.blockOpen));if(b)openPage(b.pageId)});root.querySelectorAll('[data-refblock]').forEach(x=>x.onclick=()=>{const b=byId.get(Number(x.dataset.refblock));if(!b)return;const refs=b.resolvedRefs||[];const incomingIds=incoming.get(b.id)||[];const html=`<div class="section"><h3>Block references: ${esc(b.text||'(empty block)')}</h3><p>Outgoing (${refs.length})</p>${refs.map(r=>`<div class="ref"><button class="link" data-page="${r.kind==='page'?r.id:(byId.get(r.id)?.pageId||r.id)}">${esc(r.label)}</button><small>${esc(r.page||'')}</small></div>`).join('')||'<p class="muted">No outgoing references.</p>'}<p>Incoming (${incomingIds.length})</p>${incomingIds.slice(0,100).map(id=>{const x=byId.get(id);return `<div class="ref"><button class="link" data-page="${x?.pageId}">${esc(x?.text||'Block')}</button><small>${esc(x?.page||'')}</small></div>`}).join('')}</div>`;x.closest('.block').insertAdjacentHTML('afterend',html);wireLinks($('reader'))})}
function search(){const q=$('q').value.trim().toLowerCase();if(!q){renderNav();return}const matches=records.filter(b=>b.text&&`${b.text} ${b.page}`.toLowerCase().includes(q)&&(b.kind==='page'?isActPage(pages.find(p=>p.id===b.id)):isActPage(pages.find(p=>p.id===b.pageId)))).slice(0,250);$('nav').innerHTML='';if(!matches.length){$('nav').innerHTML='<div class="empty">No matching text.</div>';return}for(const b of matches){const x=document.createElement('button');x.className='searchresult';x.innerHTML=`<strong>${esc(b.text.slice(0,220))}</strong><small>${esc(b.page)} · ${b.kind==='page'?'page':'block'}</small>`;x.onclick=()=>{if(b.kind==='page')openPage(b.id);else openPage(b.pageId)};$('nav').append(x)}$('status').textContent=`${matches.length} matches${matches.length===250?' (showing first 250)':''}`}
fetch('./data.json').then(r=>{if(!r.ok)throw Error('Could not load data.json');return r.json()}).then(init).catch(e=>{$('status').textContent='Could not load the Act';$('reader').innerHTML=`<div class="empty">${esc(e.message)}. Build the site first with build_site.py and serve it over HTTP.</div>`});
</script></body></html>
