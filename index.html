</style></head><body><header><h1>Planning Act 2026</h1><p>A searchable, linked legislative reference</p></header><div class="layout"><aside class="sidebar"><div class="searchbox"><input id="q" type="search" placeholder="Search… (all words; use quotes or brackets for phrases)" aria-label="Search the Act"><div class="topline"><button id="home">Home</button><span id="count" class="pill">Loading Act…</span></div></div><div class="filterbar"><label for="tagfilter">Filter pages by tag</label><select id="tagfilter"><option value="">All Act tags</option></select></div><div id="nav" class="nav"><div class="empty">Loading pages…</div></div><div id="status" class="status">Preparing the Act…</div></aside><main class="reader"><div id="reader"><div class="empty">Loading the Planning Act…</div></div></main></div><script>
const $=id=>document.getElementById(id);
let db,pages=[],records=[],byId=new Map(),pageByName=new Map(),children=new Map(),incoming=new Map(),current=null,searchTimer,selectedTag="",currentQuery="",activeMatchId=null,referenceView="all";
const orderAlphabet='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
function compareOrder(a,b){a=String(a||'');b=String(b||'');for(let i=0;i<Math.min(a.length,b.length);i++){const x=orderAlphabet.indexOf(a[i]),y=orderAlphabet.indexOf(b[i]);if(x!==y)return (x<0?999:x)-(y<0?999:y)}return a.length-b.length}
function naturalCompare(a,b){const tok=x=>String(x||'').toLocaleLowerCase().match(/\d+|\D+/g)||[];const aa=tok(a),bb=tok(b);for(let i=0;i<Math.min(aa.length,bb.length);i++){const x=aa[i],y=bb[i];if(/^\d+$/.test(x)&&/^\d+$/.test(y)){const d=Number(x)-Number(y);if(d)return d}else{const d=x.localeCompare(y);if(d)return d}}return aa.length-bb.length}
function refTitleHtml(label,pageLabel){let out=esc(label||'');const title=String(pageLabel||'').trim();if(title.length>=2){const re=new RegExp('('+title.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');out=out.replace(re,'<span class="ref-highlight">$1</span>')}return out}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tagLabel(id){const x=byId.get(Number(id));return x?.text||x?.name||''}
function labelsFor(ids){return (ids||[]).map(tagLabel).filter(Boolean)}
function displayBlockText(b,seen=new Set()){let t=String(b?.text||'').trim();if(!/^[0-9a-f-]{36}$/i.test(t))return t;const key=t.toLowerCase();if(seen.has(key))return '';seen.add(key);const p=pageByName.get(key);if(p)return p.label;const target=records.find(x=>x.uuid&&x.uuid.toLowerCase()===key&&x.id!==b.id);if(target&&target.text&&target.text!==t){const resolved=displayBlockText(target,seen);if(resolved)return resolved;const targetPage=pages.find(x=>x.id===target.pageId);if(targetPage)return targetPage.label;}return ''; }
function hasTag(ids,name){return labelsFor(ids).some(x=>x.replace(/^#/,'').toLowerCase()===name.replace(/^#/,'').toLowerCase())}
function parseQuery(q){q=String(q||'').trim().toLocaleLowerCase();const phrases=[...q.matchAll(/["“]([^"”]+)["”]|\[([^\]]+)\]|\(([^)]+)\)/g)].map(m=>(m[1]||m[2]||m[3]||'').trim()).filter(Boolean);const rest=q.replace(/["“][^"”]+["”]|\[[^\]]+\]|\([^)]+\)/g,' ').replace(/[{}]/g,' ').replace(/\b(and|or)\b/gi,' ');const terms=rest.split(/\s+/).map(x=>x.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'')).filter(x=>x.length>0);return {phrases,terms,raw:q}}
function queryMatches(text,q){const parsed=typeof q==='string'?parseQuery(q):q;const hay=String(text||'').toLocaleLowerCase();return parsed.phrases.every(p=>hay.includes(p))&&parsed.terms.every(t=>hay.includes(t))}
function queryHighlightTerms(q){const p=parseQuery(q);return [...new Set([...p.phrases,...p.terms])].sort((a,b)=>b.length-a.length)}
function highlightHtml(html,q=currentQuery){if(!q)return html;const terms=queryHighlightTerms(q);if(!terms.length)return html;const re=new RegExp('('+terms.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig');return html.split(/(<[^>]*>)/g).map(part=>part.startsWith('<')?part:part.replace(re,'<mark>$1</mark>')).join('')}
function init(d){db=d;pages=d.pages.filter(p=>!p.deleted);records=d.records.filter(r=>!r.deleted);byId=new Map(records.map(x=>[x.id,x]));for(const p of pages){pageByName.set((p.name||p.label).toLocaleLowerCase(),p);pageByName.set(p.label.toLocaleLowerCase(),p);if(p.uuid)pageByName.set(p.uuid.toLowerCase(),p)}for(const b of records){if(b.parentId!=null){if(!children.has(b.parentId))children.set(b.parentId,[]);children.get(b.parentId).push(b.id)}for(const r of b.refs){if(!incoming.has(r))incoming.set(r,[]);incoming.get(r).push(b.id)}}for(const arr of children.values())arr.sort((a,b)=>compareOrder(byId.get(a)?.order,byId.get(b)?.order));pages.sort((a,b)=>naturalCompare(a.label,b.label));$('count').textContent=`${pages.length} pages · ${records.length.toLocaleString()} blocks`;const tagSet=new Set();for(const r of records){for(const t of [...(r.tags||[]),...(r.pageTags||[])]){const name=tagLabel(t);if(name&&!['Page','Property','Tag'].includes(name))tagSet.add(name)}}for(const t of [...tagSet].sort((a,b)=>a.localeCompare(b))){const o=document.createElement('option');o.value=t;o.textContent=t;$('tagfilter').append(o)}$('tagfilter').onchange=()=>{selectedTag=$('tagfilter').value;renderNav($('q').value)};renderNav();$('status').textContent='Ready';$('q').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(search,120)});$('home').onclick=()=>{currentQuery='';$('q').value='';activeMatchId=null;openHome()};const hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith('page=')){const p=pages.find(p=>String(p.id)===hash.slice(5))||pageByName.get(hash.slice(5).toLowerCase());if(p)openPage(p.id)}else openHome()}
function pageHasTag(p,name){if(hasTag(p?.tags,name))return true;return records.some(b=>b.pageId===p.id&&(hasTag(b.tags,name)||hasTag(b.pageTags,name)))}
function renderNav(filter=''){const nav=$('nav');nav.innerHTML='';const q=String(filter||'').trim();const chosen=pages.filter(p=>!selectedTag||pageHasTag(p,selectedTag)).filter(p=>{const r=records.filter(b=>b.id===p.id||b.pageId===p.id);return !q||queryMatches(p.label,q)||r.some(b=>queryMatches(b.text,q))});for(const p of chosen){const b=document.createElement('button');b.className='navitem'+(current?.id===p.id?' active':'');b.innerHTML=`${highlightHtml(esc(p.label),q)}<small>${esc(labelsFor(p.tags).slice(0,3).join(' · '))}</small>`;b.onclick=()=>openPage(p.id);nav.append(b)}if(!chosen.length)nav.innerHTML='<div class="empty">No matching pages.</div>';}
function openHome(){const p=pages.find(p=>p.label==='Planning Act 2026 — Home')||pages.find(p=>/home/i.test(p.label)&&/planning act/i.test(p.label))||pages.find(p=>/planning act 2026/i.test(p.label));if(p)openPage(p.id);else{$('reader').innerHTML='<div class="reader-head"><h2>Planning Act 2026</h2></div><div class="reader-body">Choose a page from the list or search the Act.</div>'}}
function openPage(id,targetBlockId=null){const p=pages.find(x=>x.id===id);if(!p)return;current=p;history.replaceState(null,'','#page='+id);if(currentQuery)renderSearchResults(currentQuery);else renderNav($('q').value);const content=records.filter(b=>b.pageId===id&&b.parentId===id).sort((a,b)=>compareOrder(a.order,b.order));$('reader').innerHTML=`<div class="reader-head"><div class="crumb">Planning Act 2026 / Reference</div><div class="reader-title-row"><h2>${highlightHtml(esc(p.label),currentQuery)}</h2><div class="heading-actions"><button id="expandAll" class="collapse-all">Expand all</button><button id="collapseAll" class="collapse-all">Collapse all</button><button id="toReferences">To references ↓</button><button id="toTop">To top ↑</button></div></div><div class="topline">${(p.tags||[]).map(t=>`<span class="tag">${esc(tagLabel(t)||'Tag')}</span>`).join('')}<span class="pill">${content.length} top-level blocks</span></div></div><div class="reader-body"><div class="block-content">${content.map(b=>renderBlock(b,0,new Set())).join('')||'<p class="empty">No content blocks found for this page.</p>'}</div>${renderReferences(p.id)}${renderUnlinkedReferences(p)}</div>`;wireLinks($('reader'));if(targetBlockId){requestAnimationFrame(()=>{const target=$('reader').querySelector(`[data-id="${targetBlockId}"]`);if(target){for(let parent=target.parentElement?.closest('.block.collapsed');parent;parent=parent.parentElement?.closest('.block.collapsed')){parent.classList.remove('collapsed');const btn=parent.querySelector(':scope > .block-row [data-collapse]');if(btn){btn.textContent='−';btn.title='Collapse children'}}target.scrollIntoView({behavior:'smooth',block:'center'});target.classList.add('search-current');setTimeout(()=>target.classList.remove('search-current'),1800)}})}}
function renderBlock(b,depth,seen){if(!b||depth>40||seen.has(b.id))return '';seen=new Set(seen);seen.add(b.id);const kids=(children.get(b.id)||[]).map(id=>byId.get(id)).filter(x=>x&&x.pageId===b.pageId);const body=renderText(b.text);const text=String(b.text||'').trim();return `<div class="block ${!text?'empty':''} ${kids.length?'collapsible':''}" data-id="${b.id}">${text||kids.length?`<div class="block-row"><div class="blocktext">${body}</div><span class="collapse-slot">${kids.length?`<button class="mini collapse" data-collapse="${b.id}" aria-label="Collapse block" title="Collapse children">−</button>`:''}</span></div>`:''}<div class="block-children">${kids.map(k=>renderBlock(k,depth+1,seen)).join('')}</div></div>`}
function renderText(text){let out=esc(text);out=out.replace(/\[\[([^\]]+)\]\]/g,(all,label)=>{const p=pageByName.get(label.trim().toLowerCase());if(p)return `<button class="link" data-page="${p.id}">${esc(p.label)}</button>`;const block=records.find(x=>x.uuid&&x.uuid.toLowerCase()===label.trim().toLowerCase());return block?`<button class="link" data-block-open="${block.id}">${esc(displayBlockText(block)||block.page||'Open block')}</button>`:esc(label)});out=out.replace(/\(\(([0-9a-f-]{36})\)\)/gi,(all,uuid)=>{const b=records.find(x=>x.uuid&&x.uuid.toLowerCase()===uuid.toLowerCase());return b?`<button class="link" data-block-open="${b.id}">${esc(displayBlockText(b)||b.page||'Open block')}</button>`:all});if(/^[0-9a-f-]{36}$/i.test(String(text).trim())){const key=String(text).trim().toLowerCase(),p=pageByName.get(key),b=records.find(x=>x.uuid&&x.uuid.toLowerCase()===key);if(p)out=`<button class="link" data-page="${p.id}">${esc(p.label)}</button>`;else if(b)out=`<button class="link" data-block-open="${b.id}">${esc(displayBlockText(b)||b.page||'Open block')}</button>`}out=out.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>');out=out.replace(/https?:\/\/[^\s)]+/g,u=>`<a class="link" href="${u}" target="_blank" rel="noopener">${u}</a>`);return highlightHtml(out)}
function recordTagNames(b){return [...new Set([...labelsFor(b.tags),...labelsFor(b.pageTags)])].filter(x=>!['Page','Property','Tag'].includes(x)).sort((a,b)=>a.localeCompare(b))}
function renderReferences(id){const page=pages.find(p=>p.id===id);let inc=[...new Set(records.filter(r=>(r.refs||[]).includes(id)&&r.id!==id).map(r=>r.id))].map(x=>byId.get(x)).filter(Boolean);const viewNames={'all':'All references','RSP':'RSP','LUP':'LUP','NEP':'NEP','NPD':'NPD'};if(referenceView!=='all')inc=inc.filter(b=>hasTag(page?.tags,referenceView)||hasTag(b.tags,referenceView)||hasTag(b.pageTags,referenceView));inc.sort((a,b)=>naturalCompare(a.page,b.page)||compareOrder(a.order,b.order)||naturalCompare(a.text,b.text));const groups=new Map();for(const b of inc){const source=pages.find(p=>p.id===b.pageId);const key=source?.id??b.pageId??b.id;if(!groups.has(key))groups.set(key,{page:source?.label||b.page||'Other references',pageId:key,items:[]});groups.get(key).items.push(b)}const groupList=[...groups.values()].sort((a,b)=>naturalCompare(a.page,b.page));return `<div class="section" id="linkedReferences"><h3>Linked references (${inc.length})</h3><p class="crumb">Blocks that link to this page, grouped by the page they come from.</p><div class="ref-controls"><label for="refview">View</label><select id="refview">${Object.entries(viewNames).map(([v,n])=>`<option value="${v}" ${referenceView===v?'selected':''}>${esc(n)}</option>`).join('')}</select><input id="linkedRefFilter" class="ref-search" type="search" placeholder="Filter linked references…" aria-label="Filter linked references"><span class="pill">${inc.length} blocks</span></div>${groupList.map(g=>`<details class="refpage"><summary>${refTitleHtml(g.page,page?.label)} <span class="ref-context">(${g.items.length})</span></summary>${g.items.slice(0,300).map(b=>`<div class="ref"><button class="link" data-page="${b.pageId||b.id}" data-target-block="${b.id}">${refTitleHtml(displayBlockText(b)||'',page?.label)}</button></div>`).join('')}${g.items.length>300?'<small>Showing first 300 blocks from this page.</small>':''}</details>`).join('')||'<div class="empty">No incoming references match this view.</div>'}</div>`}
function renderUnlinkedReferences(page){const names=[page.label,page.name].filter(Boolean).map(x=>String(x).trim()).filter(x=>x.length>=4);const seen=new Set(),hits=[];for(const b of records){if(!b.text||b.pageId===page.id||(b.refs||[]).includes(page.id))continue;const sourceText=String(b.text);const found=names.some(name=>new RegExp('(^|[^\\p{L}\\p{N}])'+name.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')+'([^\\p{L}\\p{N}]|$)','iu').test(sourceText));if(found&&!seen.has(b.id)){seen.add(b.id);hits.push(b)}}if(referenceView!=='all')for(let i=hits.length-1;i>=0;i--){const b=hits[i];if(!(hasTag(page.tags,referenceView)||hasTag(b.tags,referenceView)||hasTag(b.pageTags,referenceView)))hits.splice(i,1)}hits.sort((a,b)=>naturalCompare(a.page,b.page)||compareOrder(a.order,b.order)||naturalCompare(a.text,b.text));const grouped=new Map();for(const b of hits){const key=b.pageId??b.id;if(!grouped.has(key))grouped.set(key,{label:b.page||'Other page',pageId:key,items:[]});grouped.get(key).items.push(b)}const groups=[...grouped.values()].sort((a,b)=>naturalCompare(a.label,b.label));return `<div class="section" id="unlinkedReferences"><h3>Possible unlinked references (${hits.length})</h3><p class="crumb">A text search for this page’s title/name. These are suggestions, not confirmed links; review before changing the graph.</p><div class="ref-controls"><label for="unlinkedRefView">View</label><select id="unlinkedRefView">${Object.entries({'all':'All references','RSP':'RSP','LUP':'LUP','NEP':'NEP','NPD':'NPD'}).map(([v,n])=>`<option value="${v}" ${referenceView===v?'selected':''}>${esc(n)}</option>`).join('')}</select><input id="unlinkedRefFilter" class="ref-search" type="search" placeholder="Filter unlinked references…" aria-label="Filter unlinked references"><span class="pill">${hits.length} possible matches</span></div>${groups.map(g=>`<details class="refpage"><summary>${refTitleHtml(g.label,page.label)} <span class="ref-context">(${g.items.length})</span></summary>${g.items.slice(0,100).map(b=>`<div class="ref"><button class="link" data-page="${b.pageId||b.id}" data-target-block="${b.id}">${refTitleHtml(displayBlockText(b),page.label)}</button></div>`).join('')}${g.items.length>100?'<small>Showing first 100 possible matches from this page.</small>':''}</details>`).join('')||'<div class="empty">No likely unlinked mentions found.</div>'}</div>`}
function wireLinks(root){root.querySelectorAll('[data-collapse]').forEach(x=>x.onclick=()=>{const block=x.closest('.block');const collapsed=block.classList.toggle('collapsed');x.textContent=collapsed?'+':'−';x.title=collapsed?'Expand children':'Collapse children'});root.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{const target=Number(x.dataset.targetBlock||0)||null;openPage(Number(x.dataset.page),target)});root.querySelectorAll('[data-block-open]').forEach(x=>x.onclick=()=>{const b=byId.get(Number(x.dataset.blockOpen));if(b)openPage(b.pageId,b.id)});const expand=$('expandAll'),collapse=$('collapseAll');if(expand)expand.onclick=()=>root.querySelectorAll('.block.collapsed').forEach(b=>{b.classList.remove('collapsed');const x=b.querySelector(':scope > .block-row [data-collapse]');if(x){x.textContent='−';x.title='Collapse children'}});if(collapse)collapse.onclick=()=>root.querySelectorAll('.block.collapsible').forEach(b=>{b.classList.add('collapsed');const x=b.querySelector(':scope > .block-row [data-collapse]');if(x){x.textContent='+';x.title='Expand children'}});const view=$('refview');if(view)view.onchange=()=>{referenceView=view.value;openPage(current.id);const section=$('reader').querySelector('#linkedReferences');if(section)section.scrollIntoView({block:'start'})};const unlinkedView=$('unlinkedRefView');if(unlinkedView)unlinkedView.onchange=()=>{referenceView=unlinkedView.value;openPage(current.id);const section=$('reader').querySelector('#unlinkedReferences');if(section)section.scrollIntoView({block:'start'})};for(const [id,sectionId] of [['linkedRefFilter','linkedReferences'],['unlinkedRefFilter','unlinkedReferences']]){const input=$(id);if(input)input.addEventListener('input',()=>{const q=input.value.trim().toLocaleLowerCase();const section=$(sectionId);section?.querySelectorAll('details.refpage').forEach(d=>{d.hidden=!!q&&!d.textContent.toLocaleLowerCase().includes(q)})})}const top=$('toTop');if(top)top.onclick=()=>document.querySelector('.reader-head')?.scrollIntoView({behavior:'smooth',block:'start'});const refs=$('toReferences');if(refs)refs.onclick=()=>document.querySelector('#linkedReferences')?.scrollIntoView({behavior:'smooth',block:'start'})}
function renderSearchResults(q){const matches=records.filter(b=>b.text&&(!selectedTag||(labelsFor(b.pageTags).includes(selectedTag)||labelsFor(b.tags).includes(selectedTag)))&&queryMatches(`${b.text} ${b.page}`,q)&&pages.some(p=>p.id===(b.kind==='page'?b.id:b.pageId))).sort((a,b)=>naturalCompare(a.page,b.page)||compareOrder(a.order,b.order)||naturalCompare(a.text,b.text)).slice(0,250);$('nav').innerHTML='';if(!matches.length){$('nav').innerHTML='<div class="empty">No matching text.</div>';return}for(const b of matches){const x=document.createElement('button');x.className='searchresult'+(activeMatchId===b.id?' current':'');x.innerHTML=`<strong>${highlightHtml(esc(b.text.slice(0,220)),q)}</strong><small>${highlightHtml(esc(b.page),q)} · ${b.kind==='page'?'page':'block'}</small>`;x.onclick=()=>{activeMatchId=b.id;const pageId=b.kind==='page'?b.id:b.pageId;openPage(pageId,b.kind==='block'?b.id:null)};$('nav').append(x)}$('status').textContent=`${matches.length} matches${matches.length===250?' (showing first 250)':''}`}
function search(){const q=$('q').value.trim();currentQuery=q;if(!q){activeMatchId=null;renderNav();if(current)openPage(current.id);return}renderSearchResults(q);if(current)openPage(current.id)}
fetch('./data.json').then(r=>{if(!r.ok)throw Error('Could not load data.json');return r.json()}).then(init).catch(e=>{$('status').textContent='Could not load the Act';$('reader').innerHTML=`<div class="empty">${esc(e.message)}. Build the site first with build_site.py and serve it over HTTP.</div>`});
</script></body></html>
