name: Build and publish Planning Act viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build viewer
        run: |
          shopt -s nullglob
          files=(source/*.edn)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one .edn file in source/; found ${#files[@]}."
            exit 1
          fi
          python build_site.py "${files[0]}" site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish website
        uses: actions/deploy-pages@v4
